<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gefGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="gefBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="64" height="64" rx="16" fill="url(#gefBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ea580c" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Linhas sutis de grade contábil -->
  <line x1="10" y1="44" x2="54" y2="44" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" opacity="0.4"/>
  <line x1="10" y1="30" x2="54" y2="30" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" opacity="0.3"/>
  <line x1="10" y1="18" x2="54" y2="18" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" opacity="0.2"/>

  <!-- Tipografia Oficial GEF -->
  <text x="32" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="2" fill="#FFFFFF">GEF</text>

  <!-- Trajetória Financeira Ascendente -->
  <path d="M 12 45 L 23 37 L 35 32 L 48 18 L 52 14" stroke="url(#gefGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Ponta da Seta -->
  <polygon points="54,12 44,14 52,22" fill="#fbbf24"/>

  <!-- Marcadores circulares nos nós -->
  <circle cx="12" cy="45" r="2.5" fill="#ea580c"/>
  <circle cx="23" cy="37" r="2.5" fill="#f97316"/>
  <circle cx="35" cy="32" r="2.5" fill="#f59e0b"/>
  <circle cx="48" cy="18" r="2.5" fill="#fbbf24"/>
</svg>
